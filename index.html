    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How many lessons will I need?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most complete beginners feel independent after 10 to 12 practical lessons. If you have driven before, 4 to 6 refresher lessons are usually enough. We review your progress after every lesson and tell you honestly where you stand rather than selling you extra hours."
            }
          },
          {
            "@type": "Question",
            "name": "Do you teach complete beginners?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — roughly six in ten of our learners have never sat in the driver’s seat before. The first lesson starts with the engine switched off in an open ground, covering seat position, mirrors and controls before the car moves at all."
            }
          },
          {
            "@type": "Question",
            "name": "Do you provide the car?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Every lesson is conducted in our own dual-control training car, and fuel is included in the course price. You never need to arrange a vehicle, and you are supervised at all times."
            }
          },
          {
            "@type": "Question",
            "name": "Do you teach automatic cars?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We do. We run separate manual and automatic training cars, and you can choose either when you book. If you are unsure, tell us which car you will drive at home and we will recommend one."
            }
          },
          {
            "@type": "Question",
            "name": "Can I choose my instructor?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can request a specific instructor when booking, and women learners can request a female instructor. Once matched, the same instructor stays with you for the entire course so your progress is never restarted."
            }
          },
          {
            "@type": "Question",
            "name": "Can I choose my lesson timings?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Slots run from 6:00 AM to 8:00 PM, Monday to Saturday, and 9:00 AM to 2:00 PM on Sunday. Early-morning and evening slots are popular with working professionals, so book those a few days ahead."
            }
          },
          {
            "@type": "Question",
            "name": "Do you offer pickup from my home or office?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pickup and drop within Alwal is included in the Complete plan and available as a small add-on for other courses. Share your address when booking and we will confirm whether it falls inside the zone."
            }
          },
          {
            "@type": "Question",
            "name": "Can you prepare me for my driving licence test?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Our Licence Test Preparation course covers the H-track and 8-track, hill start, hand signals and the exact sequence the RTO examiner follows, finishing with two full mock tests. We also guide you through the LLR and DL application steps."
            }
          },
          {
            "@type": "Question",
            "name": "What happens in the first lesson?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You meet your instructor, complete the cockpit drill — seat, steering, mirrors, pedals — and then drive in a quiet open area at very low speed. Nobody is asked to enter traffic on day one."
            }
          },
          {
            "@type": "Question",
            "name": "I am a nervous driver. Will that be a problem?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not at all. Nervousness is the most common thing we deal with, and it usually comes from being asked to do too much too early. We slow the pace down, repeat what is uncomfortable and only move forward when you say you are ready."
            }
          },
          {
            "@type": "Question",
            "name": "How do I book a lesson?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fill in the booking form on this page, message us on WhatsApp, or call the office. We confirm your instructor and slot within one working day, and payment is made after that confirmation."
            }
          },
          {
            "@type": "Question",
            "name": "What if I need to cancel or reschedule?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Reschedule free of charge with at least 12 hours’ notice. Lessons stay valid for 90 days from booking, so a busy week never means losing what you paid for."
            }
          }
        ]
